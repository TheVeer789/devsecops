name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # 🔹 Stage 1 — Compile
    - name: Compile
      run: echo "Compiling application..."

    # 🔐 Stage 2 — Gitleaks (Secrets Scan)
    - name: Gitleaks Scan
      uses: gitleaks/gitleaks-action@v2

    # 🔐 Stage 3 — Trivy FS Scan
    - name: Trivy FS Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        severity: HIGH,CRITICAL


    # 🔐 Stage 4 — Dependency Check
    - name: OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
          project: "devsecops-project"
          path: "."
          format: "HTML"

    # 🔨 Stage 6 — Build App
    - name: Build App
      run: echo "Build successful"

    # 🐳 Stage 7 — Build Docker Image
    - name: Build Docker Image
      run: docker build -t devops-app .

    # 🔐 Stage 8 — Trivy Image Scan
    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: devops-app
        severity: CRITICAL
        exit-code: '1'

    # 🚀 Stage 9 — Run Container (for testing)
    - name: Run Container
      run: docker run -d -p 8080:80 devops-app

    # 🔐 Stage 10 — OWASP ZAP Scan
    - name: ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: 'http://localhost:8080'
        fail_action: false
        allow_issue_writing: false
        artifact_name: ""

    - name: Upload ZAP Report
      uses: actions/upload-artifact@v4
      with:
        name: zap-report
        path: |
          report_html.html
          report_json.json
          report_md.md

    # 🔑 Stage 11 — Docker Login
    - name: Docker Login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # 🚀 Push Image
    - name: Push Image
      run: |
        docker tag devops-app ${{ secrets.DOCKER_USERNAME }}/devops-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/devops-app:latest
