name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # 🔹 Stage 1 — Compile
    - name: Compile
      run: echo "Compiling application..."

    # 🔐 Stage 2 — Gitleaks (Secrets Scan)
    - name: Gitleaks Scan
      uses: gitleaks/gitleaks-action@v2

    # 🔐 Stage 3 — Trivy FS Scan
    - name: Trivy FS Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        severity: HIGH,CRITICAL


    # 🔐 Stage 4 — Dependency Check
    - name: OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
          project: "devsecops-project"
          path: "."
          format: "HTML"

    # 🔨 Stage 6 — Build App
    - name: Build App
      run: echo "Build successful"

    # 🐳 Stage 7 — Build Docker Image
    - name: Build Docker Image
      run: docker build -t devops-app .

    # 🔐 Stage 8 — Trivy Image Scan
    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: devops-app
        severity: CRITICAL
        exit-code: '1'

    # 🚀 Stage 9 — Run Container (for testing)
    - name: Run Container
      run: docker run -d -p 8080:80 devops-app

    # 🔐 Stage 10 — OWASP ZAP Scan
 # 🔧 Fix permissions (important for Docker volume write)
    - name: Fix workspace permissions
      run: sudo chmod -R 777 $PWD

# 🚀 Run ZAP Baseline Scan manually (no broken GitHub action)
    - name: Run ZAP Baseline Scan
      run: |
        docker pull ghcr.io/zaproxy/zaproxy:stable
        docker run --user root --network=host \
          -v $PWD:/zap/wrk/:rw \
          ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py \
          -t http://localhost:8080 \
          -J report_json.json \
          -w report_md.md \
          -r report_html.html || true
    
    # 🔍 Debug (optional but recommended)
    - name: Verify reports
      run: ls -l
    
    # 📦 Upload reports (GitHub supported version)
    - name: Upload ZAP Report
      uses: actions/upload-artifact@v4
      with:
        name: zap-report
        path: |
          report_html.html
          report_json.json
          report_md.md

    # 🔑 Stage 11 — Docker Login + Tag + Push (FIXED)
    - name: Docker Login and Push
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        # clean username (prevents hidden newline bugs)
        DOCKER_USER=$(echo "$DOCKER_USER" | xargs)
    
        # login
        echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
    
        echo "Logged in as: $DOCKER_USER"
    
        # verify image exists
        docker images
    
        # tag image correctly
        docker tag devops-app:latest "$DOCKER_USER/devops-app:latest"
    
        # push image
        docker push "$DOCKER_USER/devops-app:latest"
